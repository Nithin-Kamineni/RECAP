architecture:
  # ============================================================
  # Simple weight-stationary, PSUM-HONEST + 8-BIT OPERANDS.
  # Selected by ECC_ARCH_FIDELITY=paper.
  #
  # This design is not from a paper -- it is the textbook
  # weight-stationary reference that ships with
  # timeloop-accelergy-exercises. There is therefore no published
  # table to match it against; what IS fixable is that the stock
  # file declares `datawidth: 16` on EVERY level while declaring
  # an 8-bit multiplier (`multiplier_width: 8`), which in an
  # 8-bit-weight study charges it 128 pJ per DRAM weight read
  # where eyeriss and simba pay 64, and packs 4 values per 64b
  # buffer word instead of 8.
  #
  # The convention applied here is the same one the two eyeriss
  # designs follow, so the four architectures are comparable:
  #
  #   operands (Weights, Inputs)  -> datawidth 8
  #   partial sums (Outputs)      -> datawidth 16, the width the
  #                                  design's own `adder_width: 16`
  #                                  already declares
  #
  # Timeloop allows one datawidth per storage level, so the stock
  # `shared_glb` -- which held all three dataspaces at 16b -- is
  # split BY DATASPACE into three levels, one per dataspace, each
  # declaring its own precision. Total capacity is unchanged at
  # 128 kB (36 + 28 + 64) and the word width is unchanged; the
  # ARRAYS ARE NOT THE STOCK ARRAYS, because splitting one 64 kB
  # operand buffer into a 36 kB and a 28 kB one gives CACTI two
  # smaller arrays to price. That is a real consequence of the
  # split, recorded in ../_shared/provenance.yaml rather than
  # compensated for.
  #
  # This makes ECC_FORCE_DATAWIDTH=8 unnecessary for this design:
  # it is now natively 8-bit on the operand path. Set
  # ECC_ARCH_FIDELITY=stock to get the 16-bit-everywhere original.
  # ============================================================
  version: 0.4
  nodes: # Top-level is hierarchical
  - !Container # Top-level system
    name: system

  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      depth: 1048576
      type: "LPDDR4"
      width: 64
      datawidth: 8         # was 16: operands are 8-bit in this study

  - !Container # WS accelerator
    name: simple_ws
    attributes:
      technology: "45nm"

  # ------------------------------------------------------------
  # THE STOCK 128 kB shared_glb (16384 x 64b, 32 banks, datawidth
  # 16), SPLIT BY DATASPACE INTO THREE LEVELS.
  #
  # WHY WEIGHTS AND INPUTS ARE SEPARATE LEVELS (2026-09-13).
  # Timeloop allows ONE `datawidth:` per storage level, so a level
  # that holds Weights beside Inputs cannot store the
  # reconstruction arm's q-bit weights without also declaring the
  # 8-bit input activations to be q bits. The single `operand_glb`
  # this replaces could therefore not carry the reduced
  # representation AT ALL: under the default
  # ECC_WEIGHT_CAPACITY_SCOPE=exclusive,
  # `archs._weight_level_parts()` skips a level whose `keep:` is
  # not Weights alone, so THE WIDTH TABLE never reshaped it and
  # `ECC_WEIGHT_DATAWIDTH_LEVELS=weight_glb` had no level to name.
  # With the split, `weight_glb` keeps Weights and nothing else
  # and is this design's global weight-buffer stage -- recon.py's
  # R2 boundary -- in the same sense `filter_glb` is Eyeriss v1's.
  #
  # THE 36 / 28 kB SPLIT, AND WHAT IT IS FROM.
  # There is no paper to divide; the ratio is chosen from THIS
  # DESIGN'S OWN cached mappings -- 53 distinct layer shapes at
  # the 65,536-word shared `operand_glb`, read out of
  # ecc_energy_study/outputs/simple_weight_stationary/:
  #
  #   summed partition size (the distinct values the level is
  #     asked to hold)            Weights 8,068,576  53.3 %
  #                               Inputs  7,064,919  46.7 %
  #   refetch (fills / partition) Weights 1.088x  Inputs 1.113x
  #   peak utilized capacity      Weights 64,000  Inputs 57,344
  #   median utilized capacity    Weights  4,320  Inputs 25,056
  #
  # So the two dataspaces ask for the level in almost equal
  # measure, and at 64 kB shared NEITHER binds -- both refetch
  # within 12 % of ideal. The demand split (53/47) is the base;
  # the tilt to 56/44 is the dataflow: this is the
  # WEIGHT-stationary design, weights are the resident operand,
  # and its low DRAM weight refetch (1.17 fetches/weight against
  # Eyeriss v1's 3.47, README.md) is the quantity the ECC study
  # measures. THE COUNTER-ARGUMENT IS REAL AND IS NOT IGNORED:
  # the input path has no PE scratchpad in this design -- inputs
  # go GLB -> input_activation_reg (depth 1) -- so this level is
  # the ONLY input reuse level on chip and does 90 % of the
  # level's reads, which is why the tilt is one bank-pair wide
  # and not a half.
  #
  # WHAT IT COSTS, so it is never read as free: 36 kB and 28 kB
  # are both smaller than the 64 kB either dataspace could reach
  # before, so fills -- DRAM traffic -- can only RISE on both.
  # The peak-demand layers re-tile: the fc shape (C1280_M1000)
  # held 64,000 weights and now has room for 36,864 at q=8, and
  # the early large-fmap shapes held up to 57,344 inputs against
  # 28,672 now. At q=5 the weight half holds 58,368 weights, so
  # the reduced representation reaches back over most of that fc
  # tile -- which is the mechanism, not a tuning.
  #
  # BANKS: 8 and 8, so the 16 operand banks are conserved and
  # BOTH levels are priced on the SAME banking model. CACTI is
  # called at the next power of two (provenance.yaml
  # `sram_banking`), so the 512-entry-bank split -- 9 banks and 7
  # -- would have priced a 36 kB array as 16 banks and a 28 kB
  # array as 8, a 2x disparity between two arrays 1.29x apart.
  # The entries per bank move instead: 576 and 448, not 512.
  # ------------------------------------------------------------
  - !Parallel
    nodes:
    - !Component # input-activation GLB: 28 kB of the 64 kB operand half
      name: input_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 3584        # 8 banks x 448 entries = 229,376 b = 28 kB
        width: 64
        n_banks: 8
        datawidth: 8       # 8-bit input activations
        read_bandwidth: 16   # items/cycle. NOT CITED -- reference-design
        write_bandwidth: 16  # inheritance; provenance.yaml `onchip_bandwidth`
      constraints:
        dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

    - !Component # weight GLB: the design's global weight-buffer stage
      # KEEPS WEIGHTS AND NOTHING ELSE, which is what lets it declare the
      # reconstruction arm's `datawidth: q`.  DECLARED here at the design's
      # own 64-b word; `archs._set_weight_geometry()` reshapes every weight
      # level per arm from THE WIDTH TABLE and renormalises depth to hold
      # these bits, so what the mapper sees is 512 x 384b (196,608 b) and
      # NOT this shape.  Do not hand-pick a width here.
      #
      # REDUCED FROM 4608 (36 kB) TO 3072 (24 kB) ON 2026-09-15, by hand and
      # with no reason recorded.  It is the value EVERY result in this
      # repository is computed at -- the reference arm fingerprints to
      # `fp-d9fbe8441aa3` under it -- so it is kept and the divergence is
      # written down rather than reverted, which would cold the whole cache.
      # WHAT IT COSTS: the operand split no longer reconstructs the stock
      # 128 kB shared_glb (24 + 28 + 64 = 116 kB), which is the rationale
      # `provenance.yaml` `simple_weight_stationary` gives for splitting it
      # at all.  See that entry's `diverges_from_reference`.
      name: weight_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 3072        # 8 banks x 384 entries = 196,608 b = 24 kB
        width: 64
        n_banks: 8
        datawidth: 8       # 8-bit weights on the baseline/embedded arm;
                           # the reconstruction arm declares q here
        read_bandwidth: 16   # items/cycle. NOT CITED -- reference-design
        write_bandwidth: 16  # inheritance; provenance.yaml `onchip_bandwidth`
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

    - !Component # partial-sum half of the shared buffer: 64 kB
      name: psum_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 8192
        width: 64
        n_banks: 16
        datawidth: 16      # accumulator width, matching mac.adder_width
        read_bandwidth: 16
        write_bandwidth: 16
      constraints:
        dataspace: {keep: [Outputs], bypass: [Inputs, Weights]}

  - !Container # Array of PEs
    name: PE
    spatial: {meshX: 16, meshY: 16}
    constraints:
      spatial:
        permutation: [C, M]
        split: 1
        factors: [R=1, S=1, P=1, Q=1]

  - !Component # PE Scratchpad -- weight stationary, so this holds Weights only
    name: pe_spad
    class: smartbuffer_SRAM
    attributes:
      depth: 192
      width: 16
      datawidth: 8         # was 16: two 8-bit weights per 16b word
    constraints:
      dataspace: {bypass: [Inputs, Outputs], keep: [Weights]}
      temporal: {permutation: [P, Q, R, S]}

  - !Parallel # Register for each data type
    nodes:
    - !Component # Weight register
      name: weight_reg
      class: storage
      subclass: register_rw    # aladdin_register with write costed (archs/_shared/components/register_rw.yaml)
      attributes:
        depth: 1
        width: 8            # one 8-bit weight
        datawidth: 8
      constraints:
        dataspace: {keep: [Weights]}
        temporal: {factors: [R=1, S=1, M=1, C=1]}

    - !Component # Input activation register
      name: input_activation_reg
      class: storage
      subclass: register_rw    # aladdin_register with write costed (archs/_shared/components/register_rw.yaml)
      attributes:
        depth: 1
        width: 8            # one 8-bit activation
        datawidth: 8
      constraints:
        dataspace: {keep: [Inputs]}
        temporal: {factors: [P=1, Q=1, C=1, N=1]}

    - !Component # Output activation register -- holds a partial sum
      name: output_activation_reg
      class: storage
      subclass: register_rw    # aladdin_register with write costed (archs/_shared/components/register_rw.yaml)
      attributes:
        depth: 1
        width: 16           # accumulator width, unchanged from stock
        datawidth: 16
      constraints:
        dataspace: {keep: [Outputs]}
        temporal: {factors: [P=1, Q=1, M=1, N=1]}

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 8
      adder_width: 16
