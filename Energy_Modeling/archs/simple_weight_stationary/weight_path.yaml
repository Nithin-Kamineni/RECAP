# THE WEIGHT PATH of this design: the stages a weight crosses from DRAM to
# the MAC, OUTER TO INNER, and the Timeloop levels that ARE each of them.
#
# It is half of the placement space; `placements.yaml` beside it is the other
# half, and the two are loaded together or not at all -- which is what makes
# "the two tables must be edited together" a property of the directory instead
# of a warning in CLAUDE.md.
#
# kind:      dram | storage | network
# prefixes:  level names as TIMELOOP PRINTS THEM. A network is named after the
#            two levels it joins (`NoC: <outer> <==> <inner>`), so the outer
#            level's name is the stable half and the prefix stops there.
# reducible: can this stage ever carry the REDUCED representation?
# evidence:  why this stage exists, with its citation. Not decoration: it is
#            what a reader checks the model against.
stages:
  - key: "dram"
    label: "DRAM (dynamic access, whole term reducible)"
    kind: "dram"
    prefixes: ["DRAM"]
    reducible: true
    evidence: "the decoder is on the DRAM die and off the fetch path, so only the k message bits of each n-bit codeword are read out and driven off the die: the whole per-bit DYNAMIC access constant carries k of every n bits under every boundary (01_project_context Sec. 1 and Sec. 4). The DRAM access is designed to fetch only the message bits of each codeword. The f_if array/interface split was removed 2026-09-09."
  - key: "weight_glb"
    label: "Global weight buffer (36 kB)"
    kind: "storage"
    prefixes: ["weight_glb"]
    reducible: true
    evidence: "Sec. 6's 'global/weight buffer'. `archs/simple_weight_stationary/arch_paper.yaml` splits the stock 128 kB shared_glb by DATASPACE into three levels, and this is the 36 kB weight one. It keeps Weights and nothing else (`dataspace: {keep: [Weights]}`), so every bit of its energy is weight energy -- which is also what lets it declare the arm's `datawidth: q`. Until 2026-09-13 this stage was a 64 kB `operand_glb` holding Inputs beside Weights, and Timeloop's one-datawidth-per-level rule meant the reduced representation could not be declared on it at all."
  - key: "weight_noc"
    label: "Weight-distribution NoC to the PE array"
    kind: "network"
    prefixes: ["NoC: inter_PE_spatial"]
    reducible: true
    evidence: "Sec. 6's 'weight-distribution NoC'. The design declares ONE spatial container (PE, meshX 16 x meshY 16), so Timeloop prints one fanout level and one network for the whole 256-PE broadcast -- unlike the two-level eyeriss meshes, this design has a single network stage."
  - key: "pe_spad"
    label: "PE weight scratchpad (stationary weights)"
    kind: "storage"
    prefixes: ["pe_spad"]
    reducible: true
    evidence: "Sec. 6's 'PE weight RF': the 192 x 16b scratchpad that holds the stationary weights while activations stream. It keeps Weights only (`dataspace: {keep: [Weights]}`), so every bit of its energy is weight energy."
  - key: "weight_reg"
    label: "Stationary weight register (one weight)"
    kind: "storage"
    prefixes: ["weight_reg"]
    reducible: false
    evidence: "Sec. 6.1's 'full stationary-weight latch', and it is ALREADY IN THE DESIGN -- a depth-1, 8-bit register between the scratchpad and the MAC. It is a STAGE, so the weight energy Timeloop bills at this level is claimed and `cross_check()` reconciles; it is NOT REDUCIBLE, and that is a property of the silicon rather than a preference. THE LATCH-AT-THE-END BOUNDARY IS WITHDRAWN (the user's decision, 2026-09-14): reconstructing at the MAC input needs the retained bits of G_rec = 9 co-resident weights and this register holds ONE, so the bits the rebuild depends on are not there, and the study is not to consider that placement in ANY architecture. The code had already reached the same conclusion from the other end: `arch.patch._weight_level_parts()` refuses to declare `datawidth: q` on a depth-1 level at all -- \"a pipeline latch, not a reuse level\" -- so the old recon5 could not be mapped and every one of its arms raised `ECC_WEIGHT_DATAWIDTH_LEVELS names weight_reg, which simple_weight_stationary has no weight-carrying level called`. R4b (a retained-reconstruction register) was removed on 2026-09-10 for the neighbouring reason and stays removed: see CLAUDE.md and FINDINGS 2.7."
