# THE RECONSTRUCTION BOUNDARIES of this design: which stages of
# `weight_path.yaml` keep the REDUCED representation, and where the encoder
# that rebuilds the rest sits.
#
# `reduced` must be a PREFIX of the path's reducible stages in path order, and
# every reducible stage must be reached by some boundary --
# `arch.arms.validate_placement_space()` refuses anything else, because a stage
# nobody reaches leaves every boundary below it reporting a saving that the
# whole list understates.
#
# site_counter: reads | fills | ingresses | deliveries.  A NETWORK boundary's
# encoders run once per ARRIVAL, not once per injection: `deliveries` is
# `ingresses x multicast factor`. ECC_RECON_ENCODER_SITE=source swaps it back.
#
# `rating` is the source discussion's HYPOTHESIS, carried so the result can be
# read against it. It is not a result.
placements:
  - key: "recon1"
    variant: "recon_source_noc_ingress"
    label: "R1 - reconstruct at chip ingress, before the weight GLB"
    short: "R1\n@ chip ingress"
    rating: "control"
    reduced: ["dram"]
    site_stage: "dram"
    site_counter: "reads"
    description: "The die drives only the k message bits of each codeword across the DRAM interface and an encoder at chip ingress restores them before anything on chip stores them, so nothing on chip carries the reduced form -- not the weight GLB, not the routers, not the mesh. It is the control that isolates the DRAM-interface saving, which every boundary shares, from any on-chip saving, and it pays one reconstruction per codeword fetched from DRAM with nothing but that interface saving against it. Before 2026-09-14 this design had no weight GLB, so R1 sat at the weight-NoC ingress; the buffer is now the first on-chip weight stop and R1 sits above it."
  - key: "recon2"
    variant: "recon_weight_glb_output"
    label: "R2 - reconstruct at the weight-GLB output"
    short: "R2\n@ weight GLB"
    rating: "3/5"
    reduced: ["dram", "weight_glb"]
    site_stage: "weight_glb"
    site_counter: "reads"
    description: "The 24 kB weight GLB holds weight tiles in the reduced form, so it holds N/K more weights per bank and its weight access bit-volume falls with the bit count; one encoder at its read port restores full width before the routers. This is the boundary `eyeriss_v2_like` has nowhere to put -- the published v2 stores no weights in the GLB -- and it exists here only because this variant declares the buffer the earlier v2 designs carry. It is the boundary ECC_RECON_DEFAULT names, and it means the same thing here as on eyeriss_like_wglb and simple_weight_stationary: reconstruct at the weight global buffer. Downstream -- routers, mesh, cluster fanout, scratchpad -- is full width."
  - key: "recon3"
    variant: "recon_destination_cluster"
    label: "R3 - reconstruct at the destination-cluster boundary"
    short: "R3\n@ cluster edge"
    rating: "4/5"
    reduced: ["dram", "weight_glb", "weight_noc", "inter_cluster_mesh"]
    site_stage: "inter_cluster_mesh"
    site_counter: "deliveries"
    description: "The weight GLB, the routers and the long-distance hierarchical mesh all carry the reduced form, and an encoder at each destination cluster restores it before the cluster-local fanout. One encoder per cluster rather than one per PE, and the mesh -- the expensive hop -- moves fewer bits. The encoders run once per word ARRIVING at a cluster, not once per word injected into the mesh: the mesh multicasts, so those two counts differ by its multicast factor, and only the arrival count is consistent with the mesh carrying reduced-width data at all (an encoder before the fanout is a boundary above it). Sec. 7.1's multicast tradeoff; `ECC_RECON_ENCODER_SITE` is the experiment variable it asks for. The routers are folded into this boundary rather than given one of their own: an encoder between the router state and the mesh it feeds is not a distinct physical site."
  - key: "recon4"
    variant: "recon_pe_spad_input"
    label: "R4 - reconstruct at the PE weight-SPad input"
    short: "R4\n@ SPad input"
    rating: "4/5"
    reduced: ["dram", "weight_glb", "weight_noc", "inter_cluster_mesh", "cluster_local"]
    site_stage: "weight_spad"
    site_counter: "fills"
    description: "Everything above the PE carries the reduced form -- buffer, routers and both networks; the encoder sits at the scratchpad write port, so the SPad itself stays full width and keeps its capacity and read cost. The encoder runs once per weight FILLED into a PE, which is the smallest count of any boundary below the network."
  - key: "recon5"
    variant: "recon_pe_spad_output"
    label: "R5a - reconstruct on every weight-SPad read"
    short: "R5a\n@ SPad output"
    rating: "3/5"
    reduced: ["dram", "weight_glb", "weight_noc", "inter_cluster_mesh", "cluster_local", "weight_spad"]
    site_stage: "weight_spad"
    site_counter: "reads"
    description: "Every weight-carrying stage holds the reduced form, so the scratchpad's write and read bit-volume fall with its capacity too, and the encoder sits at its read port. The risk the source discussion names is the whole story here: the encoder now runs once per weight DELIVERED to the datapath, and a weight-stationary inner loop delivers each resident weight thousands of times."
