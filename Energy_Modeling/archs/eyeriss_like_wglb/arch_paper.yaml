architecture:
  # ============================================================
  # Eyeriss v1 WITH a filter GLB -- the level JSSC 2017 Sec. V-A
  # says exists and archs/eyeriss_like/arch_paper.yaml omits.
  # Selected by ECC_ARCH_FIDELITY=paper.
  #
  # THE STRUCTURAL DIFFERENCE from archs/eyeriss_like/arch_paper.yaml
  # is the Weights branch of the GLB !Parallel: where that file puts
  # !Nothing, this one puts a filter buffer.  It is NOT the only
  # difference any more -- three declared capacities also diverge,
  # deliberately; see the table below -- and this one is declared at
  # 2 kB, not the paper's 8 kB.
  #
  # WHY BOTH EXIST.  The base model argues the 8 kB is a PREFETCH
  # buffer the RS dataflow does not need, so declaring it as a
  # Timeloop storage level would hand v1 weight reuse it does not
  # have.  That argument is reasonable and it is also unfalsifiable
  # from the paper alone -- and it is not neutral, because it
  # maximises DRAM weight traffic, which is the exact quantity this
  # study measures.  So the two files BRACKET the answer:
  #
  #   eyeriss_like        no weight reuse below DRAM  -> upper bound
  #                       on DRAM weight traffic, and therefore on
  #                       the ECC saving
  #   eyeriss_like_wglb   a filter buffer as a full reuse level
  #                       -> lower bound.  Declared at 2 kB, so
  #                       this bound is LOOSER than the paper's
  #                       8 kB would make it.
  #
  # Quote the pair, not either one alone.
  #
  # Source of every number below:
  #   Y.-H. Chen, T. Krishna, J. Emer, V. Sze, "Eyeriss: An
  #   Energy-Efficient Reconfigurable Accelerator for Deep
  #   Convolutional Neural Networks", IEEE JSSC 52(1), 2017.
  #   https://eems.mit.edu/wp-content/uploads/2016/11/eyeriss_jssc_2017.pdf
  #
  # This file differs from the stock example_designs/eyeriss_like
  # in one structural place, a correction toward the paper:
  #
  #  1. The single 8-bit `shared_glb` is split into an 8b ifmap
  #     buffer and a 16b psum buffer.  The stock design declared
  #     ONE level at `datawidth: 8` holding both Inputs and
  #     Outputs, so Timeloop packed 8 psums into each 64b word
  #     and billed a 16-bit partial sum as one byte -- 3.6 pJ per
  #     psum where Eyeriss v2's honestly-declared 20b psum GLB
  #     pays 11.7.  That single line was most of the measured
  #     v1-beats-v2 gap.  The paper's own GLB is already banked
  #     and statically assigned per dataspace, so the split is
  #     also the more faithful structure.
  #
  # ============================================================
  # THREE DECLARED CAPACITIES DIVERGE FROM JSSC 2017 ON PURPOSE.
  # Read this before quoting a capacity, and before "fixing" one.
  #
  #                     this file    JSSC 2017 Sec. V
  #   filter_glb        256 x 64b     1024 x 64b  (8 kB, two
  #                     = 2 kB        512-b x 64-b banks)
  #   weights_spad       16 x 16b      224 x 16b  ("the filter
  #                     = 32 8-bit     spad is implemented in a
  #                       weights      224-b x 16-b SRAM")
  #   psum_spad          96 x 16b       24 x 16b
  #   psum_glb         6656 x 64b     6144 x 64b  (12 of the 25
  #                    (= 13 banks     512-b x 64-b banks)
  #                     worth)
  #
  # They arrived in commit 3a770cc (2026-09-11) without a note,
  # and the comments beside them went on quoting the PAPER's
  # numbers while the file declared these -- which is how a
  # reader came to believe filter_glb held 8 kB when it holds 2.
  # CONFIRMED AND KEPT 2026-09-13 (prompt_7 C1.7, user's call):
  # the cold pass runs on the geometry as declared here.  The
  # comments are corrected to say what is declared; the numbers
  # are not.
  #
  # WHAT THAT COSTS, so it is never quoted as the published chip:
  #  * `archs/eyeriss_like/arch_paper.yaml` -- the retired v1
  #    variant -- still carries 224 and 24, so the two v1 files
  #    do NOT declare the same PE.
  #  * prompt_5 and legacy/FINDINGS_detail_2026-09-11.md record
  #    what the depth-16 spad does to THE WIDTH TABLE: at width
  #    96 it renormalises to depth 3 (288 bits, +12.5%), which is
  #    barely a reuse level, and the resulting per-code spread in
  #    the 8-bit arm is what made BCH(63,39) once read as a
  #    37.69% win that was really the reference breaking.
  #  * `archs/_shared/provenance.yaml` (`v1_declared_capacities`)
  #    carries the same table, so `run.sh validate` reports it.
  # THE ONLY CAPACITY THIS FILE MAY BE QUOTED FOR is its own.
  # ============================================================
  #
  # PRECISION CONVENTION.  Eyeriss v1 is a 16-bit fixed-point
  # design; this study quantizes OPERANDS to 8 bits and leaves
  # ACCUMULATORS at the width the paper declares.  So every level
  # that carries weights or iacts is `datawidth: 8`, every level
  # that carries partial sums is `datawidth: 16`, and the paper's
  # physical word widths are kept unchanged -- the same SRAM word
  # simply holds two 8-bit operands where it held one 16-bit one.
  # ============================================================
  version: 0.4
  nodes:
  - !Container # Top-level system
    name: system

  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      depth: 1048576
      width: 64
      datawidth: 8         # operands, and ofmaps after ReLU. Psums that spill
                           # to DRAM are billed at 8b here for BOTH eyeriss
                           # designs, so the approximation is symmetric.

  - !Container # Eyeriss accelerator
    name: eyeriss_wglb
    attributes:
      technology: "45nm"   # DEVIATES from the paper's 65nm, to match the other
                           # example designs so a cross-architecture gap is
                           # architecture and not silicon. ECC_FORCE_TECHNOLOGY.

  # ------------------------------------------------------------
  # Global buffer.  JSSC 2017 Sec. V-A:
  #   "The Eyeriss accelerator has a GLB of 108 kB ... 100 kB of
  #    the GLB is allocated for ifmaps and psums as required by
  #    the RS dataflow for reuse. Even though it is not required
  #    by the dataflow, the remaining 8 kB (two banks of
  #    512-b x 64-b SRAMs) of the GLB is allocated for filter
  #    weights to compensate for insufficient off-chip traffic
  #    bandwidth."
  #   "...the space is divided into 25 banks, each of which is a
  #    512-b x 64-b (4 kB) SRAM. Each bank is assigned entirely to
  #    ifmaps or psums, and the assignment is reconfigurable..."
  #
  # Timeloop has no dynamic repartitioning, so the 25 banks are
  # split statically 13 ifmap / 12 psum.  Bank GEOMETRY is exact
  # (512 x 64b), which is what sets the per-access energy; only
  # the ifmap:psum capacity ratio is frozen.
  #
  # THE FILTER ALLOCATION *IS* MODELLED AS A REUSE LEVEL HERE.
  # That is the ONE thing that separates this file from
  # archs/eyeriss_like/arch_paper.yaml, which puts `!Nothing` in
  # its place; the paragraph that used to sit here said the
  # opposite, copied from that file.  The argument for omitting
  # it is the paper's own words -- the 8 kB is a prefetch buffer
  # the RS dataflow does not need ("even though it is not
  # required by the dataflow ... the GLB preloads the filters
  # used by the next processing pass") -- and it is reasonable,
  # unfalsifiable from the paper alone, and NOT neutral, because
  # omitting the level maximises DRAM weight traffic, which is
  # the exact quantity this study measures.  So the two files
  # bracket the answer and `eyeriss_like_wglb` is the design
  # (CLAUDE.md, decided 2026-09-10).
  #
  # DECLARED BANDWIDTHS BELOW ARE NOT CITED.  Every `read_bandwidth`
  # and `write_bandwidth` in this file is inherited from the
  # reference design; JSSC 2017 publishes no per-level port width.
  # They are not decoration: `ifmap_glb` throttles 11 of 43 cached
  # shapes and `filter_glb`'s 16 items/cycle is what caps every
  # fully-connected layer at 9.52% PE utilisation.  Recorded in
  # archs/_shared/provenance.yaml as `onchip_bandwidth`
  # (prompt_7 C1.4) -- read it before resting a headline on one.
  # ------------------------------------------------------------
  - !Parallel
    nodes:
    - !Component # ifmap GLB: 13 of the 25 banks = 52 kB
      name: ifmap_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 6656          # 13 banks x 512 entries
        width: 64            # paper: 512-b x 64-b SRAM banks
        n_banks: 13
        datawidth: 8         # 8-bit iacts (this study's quantization)
        read_bandwidth: 16
        write_bandwidth: 16
      constraints:
        dataspace: {keep: [Inputs], bypass: [Weights, Outputs]}

    - !Component # psum GLB: 12 of the 25 banks = 48 kB
      name: psum_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 6656          # DECLARED, not 12 x 512 = 6144. The bank
                             # COUNT below is still the paper's 12, so this
                             # is 554.67 entries per bank and the GLB totals
                             # 13 + 12 + 2 = 27 of its 25 banks. Deliberate
                             # (user's call, 2026-09-13): see the divergence
                             # table above. n_banks is what CACTI prices, so
                             # per-access energy is still a 512 x 64b bank.
        width: 64            # paper: 512-b x 64-b SRAM banks
        n_banks: 12
        datawidth: 16        # psums are 16b in v1: "The computation consists
                             # of a 16-b two-stage [multiplier and adder] ...
                             # truncated from 32 to 16 b"
        read_bandwidth: 16
        write_bandwidth: 16
      constraints:
        dataspace: {keep: [Outputs], bypass: [Weights, Inputs]}

    - !Component # filter GLB: the 2 remaining banks. JSSC 2017 Sec. V-A calls
      # them 8 kB; THIS FILE DECLARES 2 kB (see the divergence table above):
      #   "Even though it is not required by the dataflow, the remaining 8 kB
      #    (two banks of 512-b x 64-b SRAMs) of the GLB is allocated for filter
      #    weights to compensate for insufficient off-chip traffic bandwidth.
      #    While the PE array is working on a processing pass, the GLB preloads
      #    the filters used by the next processing pass."
      #
      # THIS LEVEL IS IN THE PAPER; archs/eyeriss_like OMITS IT.  See README.md.
      # Bank geometry is exact (512 x 64b, 2 banks), so per-access energy is the
      # same CACTI array as the other 23 banks of the same GLB.
      #
      # DECLARED CAPACITY IS 2 kB, NOT THE PAPER'S 8 kB -- see the
      # divergence table at the top of this file.  The paper's two banks
      # of 512 x 64b would be `depth: 1024`; this declares 256, i.e. 128
      # entries per bank.  Kept deliberately 2026-09-13.  BANK GEOMETRY
      # is the paper's shape (64b words, 2 banks), which is what sets the
      # per-access energy; only the entry count differs.
      name: filter_glb
      class: smartbuffer_SRAM
      attributes:
        depth: 256           # 2 banks x 128 entries = 16,384 b = 2 kB
                             # (JSSC 2017 says 8 kB -> depth 1024; see above)
        width: 64            # paper: 64-b SRAM words
        n_banks: 2           # reaches CACTI since prompt_7 C1.7
        datawidth: 8         # 8-bit weights (this study's quantization)
        read_bandwidth: 16   # items/cycle. NOT CITED -- reference-design
        write_bandwidth: 16  # inheritance; provenance.yaml `onchip_bandwidth`.
                             # This is the level that binds every fc layer.
      constraints:
        dataspace: {keep: [Weights], bypass: [Inputs, Outputs]}

  - !Container # Each column of PEs produces a different psum row
    name: PE_column
    spatial: {meshX: 14}     # paper: 168 PEs in a 12 x 14 array
    constraints:
      spatial:
        permutation: [N, C, P, R, S, Q, M]
        factors: [N=1, C=1, P=1, R=1, S=1]
        split: 999

  - !Container # Each PE in the column receives a different filter row
    name: PE
    spatial: {meshY: 12}
    constraints:
      spatial:
        split: 0
        permutation: [N, P, Q, R, S, C, M]
        factors: [N=1, P=1, Q=1, R=1]

  - !Parallel # Input/Output/Weight scratchpads in parallel
    nodes:
    - !Component # ifmap spad -- paper: 12 x 16b, registers
      # Address-DECODED register file, not a CAM: see
      # archs/_shared/components/regfile_decoded.yaml. Upstream's
      # smartbuffer_RF fires all `depth` comparators per access, which
      # was 76% of this level's energy and is charged to no other
      # design in the study. Geometry and cell type are unchanged.
      name: ifmap_spad
      class: smartbuffer_RF_decoded
      attributes:
        depth: 12
        width: 16
        datawidth: 8         # 24 8-bit iacts in the paper's 12 x 16b array
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {keep: [Inputs]}
        temporal:
          permutation: [N, M, C, P, Q, R, S]
          factors: [N=1, M=1, C=1, P=1, Q=1, R=1, S=1]

    - !Component # filter spad -- paper: "the filter spad is implemented in a
      # 224-b x 16-b SRAM due to its large size".  The stock example design
      # declared depth 192; 224 is the published number.
      # STORAGE CLASS: SRAM, not RF.  Accelergy's `regfile` compound component
      # (which `smartbuffer_RF` instantiates) declares `comparator[1..depth]`
      # and fires EVERY one of them on EVERY read -- a fully-associative CAM.
      # At depth 224 that is 95% of the modelled access energy spent on
      # address comparators this design does not contain, and the error grows
      # LINEARLY with depth, which is backwards from real memory physics.
      # The paper calls this level an SRAM (quoted above), so it is costed by
      # CACTI like every other SRAM in the study. Measured effect: 4.39 pJ
      # -> see provenance.yaml.  Levels the papers call registers keep
      # smartbuffer_RF; there the clamp at 64 comparators bounds the error.
      # THE STORAGE CLASS ARGUMENT IS THE PAPER'S; THE DEPTH IS NOT -- this
      # file declares 16, not the published 224.  See the divergence table
      # at the top.  It declares no `n_banks`, so it keeps the unbanked
      # `smartbuffer_SRAM` and prices exactly as it did before prompt_7 C1.7.
      name: weights_spad
      class: smartbuffer_SRAM
      attributes:
        depth: 16            # 16 x 16b = 256 b = 32 8-bit weights per PE.
                             # THE PAPER SAYS 224 x 16b = 448 weights; this
                             # file deliberately declares the smaller array
                             # (divergence table at the top).  THE WIDTH
                             # TABLE renormalises 256 b to depth 3 at width
                             # 96, so this is a shallow reuse level -- which
                             # is what prompt_5 warns about.
        width: 16
        datawidth: 8         # 8-bit weights (this study's quantization)
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {keep: [Weights]}
        temporal:
          permutation: [N, M, P, Q, S, C, R]
          factors: [N=1, M=1, P=1, Q=1, S=1]

    - !Component # psum spad -- paper: 24 x 16b, registers.
      # DECLARED 96, NOT THE PAPER'S 24 (divergence table at the top of
      # this file).  The stock example design declared 16, and this file
      # declared 64 until 2026-09-13.  Raised to 96 deliberately
      # (user's call, 2026-09-13); it holds partial sums, which
      # reconstruction never touches, so it moves no ECC percentage --
      # but it is not the published PE and must not be quoted as one.
      # Address-DECODED register file, not a CAM: see
      # archs/_shared/components/regfile_decoded.yaml. Upstream's
      # smartbuffer_RF fires all `depth` comparators per access, which
      # was 80% of this level's energy and is charged to no other
      # design in the study. Geometry and cell type are unchanged.
      name: psum_spad
      class: smartbuffer_RF_decoded
      attributes:
        depth: 96
        width: 16
        datawidth: 16        # partial sums stay at the accumulator width
        update_fifo_depth: 2
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {keep: [Outputs]}
        temporal:
          permutation: [N, C, P, Q, R, S, M]
          factors: [N=1, C=1, R=1, S=1, P=1, Q=1]

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 8    # 8-bit operands (this study's quantization)
      adder_width: 16        # paper: 16-b accumulate, psums truncated 32 -> 16
