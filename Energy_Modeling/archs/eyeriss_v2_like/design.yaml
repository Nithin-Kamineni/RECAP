# ONE DESIGN, DECLARED. ProjectRestructure phase 5: a new architecture is
# this directory and nothing else -- no Python anywhere names it.
#
# `arch_paper.yaml` is the CHIP (every number cited); this file is what the
# study needs to know ABOUT the chip that the chip's own YAML does not say.
#
# Every architecture-related fact lives HERE, not in env.sh and not in code
# (EnvReorganisation phase 1, 2026-09-14): the clock and the leakage densities
# below, THE WIDTH TABLE in widths.yaml beside this file, the weight path and
# the boundaries in their own two files.
name: eyeriss_v2_like

# Where this design sits on a default axis, and nothing more: `KNOWN_ARCHS` is
# this file's order, so a figure that sweeps every declared design reads
# left to right in it. A new design may OMIT it and lands after the ordered
# ones, alphabetically -- it is a presentation choice, not a registration.
order: 2
label: "Eyeriss v2"

# The published design stores weights COMPRESSED and this study models it
# DENSE. Every result carries the caveat; before phase 5 this was an
# `arch.startswith("eyeriss_v2")` in study/placement_study.py.
weights_stored_compressed: true
compression_note: "the published PE stores weights CSC-compressed with a separate address scratchpad (JETCAS 2019 Table IV: weight data 288B, weight address 16x7b); this study models the design DENSE"

# The share of TOTAL energy the design's own paper reports for its
# interconnect. `study/audit.py` and `study/baseline.py` check the modelled
# share against it -- a miss on one model is a prompt to look, a miss on
# EVERY model is a broken constant. Before phase 5 this band was two
# `arch.startswith("eyeriss_v2_like")` branches.
noc_published_share:
  low: 0.06
  high: 0.1
  citation: "JETCAS 2019 Sec. V / Fig. 18: the hierarchical mesh is \"6%-10% of the total energy consumption\""

# ---- the core clock, in MHz ------------------------------------------------
# no cited rate; the study's model default. config.Config.cycle_seconds_for() is the ONLY place MHz becomes
# seconds; it reaches the mapper through globals_<arch>.yaml and is therefore
# in the fingerprint -- CHANGING IT COLDS THIS DESIGN'S MAPPER CACHE. A design
# that omits it runs at ECC_GLOBAL_CYCLE_SECONDS. (Until 2026-09-14 this was
# env.sh's ECC_ARCH_CLOCK_MHZ table.)
clock_mhz: 1000

# ---- component standby (leakage) densities, in nW ---------------------------
# POWER, not energy: the evaluator multiplies by THIS design's cycle period at
# the point of use (env.sh section 6 TRAP 2 -- the DC idle term is the opposite
# case and is rescaled). Charged to ALL THREE arms when ECC_STATIC_ENERGY=1,
# evaluator-only, never in the fingerprint. The study's densities: SRAM is
# CACTI 45nm itrs-lop measured on Eyeriss v1's own 52 kB array (itrs-hp would
# be 59.37); RF is the 40nm register number from accelergy-aladdin-plug-in's
# reg.csv; MAC is the ERT's own leak row (0.00784449 pJ/cycle @ 1 GHz).
# (Until 2026-09-14 this was env.sh's ECC_LEAKAGE_NW table.)
leakage_nw:
  sram_bit: 2.693          # per stored bit of a shared SRAM macro
  rf_bit: 70.0             # per stored bit of a PE-replicated register file
  mac_instance: 7844.9     # per MAC
